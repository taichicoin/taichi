<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>卡牌图鉴 · 早鸟名单</title>
    <style>
        :root {
            --bg: #fdf2cc;
            --text: #3d2b00;
            --gold: #8b5e00;
            --nav-bottom: 4vh;
        }

        [hidden] { display: none !important; }

        html {
            min-height: 100%;
            background-color: #1a1206;
        }

        body {
            background-color: #1a1206;
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(255, 215, 80, 0.22) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 70%, rgba(255, 180, 50, 0.18) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 50%, rgba(255, 240, 180, 0.20) 0%, transparent 70%),
                linear-gradient(rgba(30, 18, 0, 0.28), rgba(30, 18, 0, 0.28)),
                url('/assets/webp/bg2.webp');
            background-size: auto, auto, auto, auto, cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed, fixed, fixed, fixed, fixed;

            color: var(--text);
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            margin: 0;
            padding: 8px 8px calc(var(--nav-bottom) + 110px) 8px;
            min-height: 100vh;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        /* ========== 顶部标题：左对齐到卡片最左边 ========== */
        h1 {
            max-width: 360px;
            margin: 0 auto 10px auto;
            padding-left: 4px;
            /* 右侧留出语言按钮的空间，避免被遮住 */
            padding-right: 56px;
            box-sizing: border-box;

            text-align: left;
            color: #fff6d6;
            font-size: 1.3em;
            letter-spacing: 0.04em;
            text-shadow:
                0 1px 3px rgba(0, 0, 0, 0.75),
                0 0 14px rgba(255, 215, 120, 0.35);
        }

        /* ========== 右上角语言切换按钮 ========== */
        .lang-toggle {
            position: fixed;
            top: 10px;
            right: 12px;
            z-index: 1000;
            min-width: 42px;
            height: 32px;
            padding: 0 10px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.42);
            background: rgba(255, 255, 255, 0.20);
            backdrop-filter: blur(12px) saturate(160%);
            -webkit-backdrop-filter: blur(12px) saturate(160%);
            color: #fff6d6;
            font-family: inherit;
            font-size: 0.75em;
            font-weight: 700;
            letter-spacing: 0.05em;
            cursor: pointer;
            box-shadow:
                0 4px 14px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
            transition: background 0.2s ease, transform 0.12s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .lang-toggle:hover { background: rgba(255, 255, 255, 0.32); }
        .lang-toggle:active { transform: scale(0.94); }

        /* ========== 卡牌网格：三列等分自适应 ========== */
        #card-gallery {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px 8px;
            width: 100%;
            max-width: 360px;
            margin: 0 auto;
            padding: 4px;
            align-items: start;
            box-sizing: border-box;
        }

        /* ========== 早鸟名单网格：两列磨砂方块 ========== */
        #early-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px 10px;
            width: 100%;
            max-width: 360px;
            margin: 0 auto;
            padding: 4px;
            align-items: stretch;
            box-sizing: border-box;
        }

        .early-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            min-height: 76px;
            padding: 14px 8px;
            border-radius: 12px;
            box-sizing: border-box;
            text-decoration: none;

            background: linear-gradient(
                135deg,
                var(--early-bg, rgba(255, 255, 255, 0.18)),
                rgba(255, 255, 255, 0.10)
            );
            backdrop-filter: blur(16px) saturate(160%);
            -webkit-backdrop-filter: blur(16px) saturate(160%);
            border: 1px solid var(--early-border, rgba(255, 255, 255, 0.4));
            box-shadow:
                0 8px 22px rgba(0, 0, 0, 0.28),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);

            color: #fff6d6;
            font-weight: 700;
            letter-spacing: 0.02em;
            text-shadow:
                0 1px 3px rgba(0, 0, 0, 0.75),
                0 0 10px rgba(0, 0, 0, 0.35);

            transition: transform 0.22s ease, background 0.22s ease,
                        box-shadow 0.22s ease, border-color 0.22s ease;
            animation: cardIn 0.34s ease backwards;
            -webkit-tap-highlight-color: transparent;
        }
        .early-card:hover {
            transform: translateY(-4px);
            background: linear-gradient(
                135deg,
                var(--early-bg, rgba(255, 255, 255, 0.18)),
                rgba(255, 255, 255, 0.18)
            );
            box-shadow:
                0 12px 28px rgba(0, 0, 0, 0.36),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }
        .early-card:active {
            transform: translateY(-1px) scale(0.98);
        }

        .early-index {
            font-size: 0.58em;
            font-weight: 600;
            opacity: 0.72;
            letter-spacing: 0.1em;
        }

        .early-domain {
            font-size: 0.92em;
            line-height: 1.25;
            word-break: break-all;
            text-align: center;
        }

        /* ========== 卡片外层容器：完全透明，无框无阴影 ========== */
        .card-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            min-width: 0;
            border-radius: 0;
            overflow: visible;
            box-shadow: none;
            background: transparent;
            backdrop-filter: none;
            transition: transform 0.22s ease;
            animation: cardIn 0.34s ease backwards;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(10px) scale(0.96); }
            to   { opacity: 1; transform: none; }
        }
        .card-wrapper:hover {
            transform: translateY(-4px);
        }

        /* ========== 图片竖框：仅用于定位，完全不可见 ========== */
        .card-image-area {
            position: relative;
            width: 100%;
            aspect-ratio: 100 / 137;
            overflow: hidden;
            flex-shrink: 0;
            border-radius: 0;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-image-area img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .img-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 6px;
            font-size: 0.66em;
            font-weight: 600;
            color: #5c4410;
            background: linear-gradient(135deg, rgba(255,248,220,0.92), rgba(255,225,150,0.8));
            border-radius: 0;
        }

        /* 攻击力 & 生命值：直接浮在图片上 */
        .card-atk, .card-hp {
            position: absolute;
            top: 78%;
            transform: translateY(-50%);
            font-weight: bold;
            text-shadow: 0 0 5px #000, 0 0 9px rgba(0,0,0,0.85);
            font-size: 0.82em;
            z-index: 3;
            pointer-events: none;
            letter-spacing: 0.3px;
        }
        .card-atk { left: 2%; color: #ff6b6b; }
        .card-hp  { right: 2%; color: #6bff6b; }

        /* ========== 信息栏：去掉磨砂底，文字直接显示在背景上 ========== */
        .card-info {
            padding: 5px 2px 0 2px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border: none;
            border-radius: 0;
            min-height: 0;
            box-sizing: border-box;
        }

        .card-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.62em;
            line-height: 1.2;
            padding: 0 1px;
            gap: 3px;
        }
        .card-faction {
            color: #fff6d6;
            font-weight: 700;
            letter-spacing: 0.2px;
            max-width: 68%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-shadow:
                0 1px 3px rgba(0, 0, 0, 0.85),
                0 0 8px rgba(0, 0, 0, 0.55);
        }
        .card-rarity {
            font-weight: bold;
            letter-spacing: 0.2px;
            flex-shrink: 0;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
        }
        .rarity-Common    { color: #d4d4d4; }
        .rarity-Rare      { color: #7db4ff; }
        .rarity-Epic      { color: #c58bff; }
        .rarity-Legendary { color: #ffc24d; }

        /* ========== 技能介绍：唯一保留的白色毛玻璃框 ========== */
        .card-skill-desc {
            color: #14140a;
            font-weight: 600;
            text-align: center;
            line-height: 1.35;
            word-break: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 6px;
            padding: 4px 5px;
            border: 1px solid rgba(255, 255, 255, 0.65);
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.3), 0 2px 5px rgba(0,0,0,0.25);
            transition: background 0.2s, border-color 0.2s;
        }
        .card-wrapper:hover .card-skill-desc {
            background: rgba(255, 255, 255, 0.7);
            border-color: rgba(255, 255, 255, 0.8);
        }

        .gallery-status {
            grid-column: 1 / -1;
            text-align: center;
            color: #ffe9b0;
            font-size: 0.85em;
            padding: 40px 0;
            letter-spacing: 0.05em;
            line-height: 1.7;
            text-shadow: 0 1px 3px rgba(0,0,0,0.7);
        }
        .gallery-status.error { color: #ff9d8a; }
        .gallery-status small { font-size: 0.85em; opacity: 0.8; }

        /* ========== 底部透明磨砂导航栏 ========== */
        .bottom-nav {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: var(--nav-bottom);
            display: flex;
            align-items: center;
            gap: 3px;
            padding: 6px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(18px) saturate(180%);
            -webkit-backdrop-filter: blur(18px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.42);
            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.55);
            z-index: 999;
            white-space: nowrap;
            max-width: calc(100vw - 24px);
        }

        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
            border: none;
            background: transparent;
            color: #f3e3b8;
            font-family: inherit;
            font-size: 0.68em;
            font-weight: 700;
            letter-spacing: 0.02em;
            padding: 7px 12px;
            border-radius: 999px;
            cursor: pointer;
            transition: background 0.22s ease, color 0.22s ease,
                        box-shadow 0.22s ease, transform 0.12s ease;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
        }
        .nav-btn .nav-icon {
            font-size: 1.35em;
            line-height: 1;
            transition: transform 0.22s ease;
        }
        .nav-btn:hover { color: #fff6d6; }
        .nav-btn:active { transform: scale(0.94); }

        .nav-btn.active {
            background: rgba(255, 255, 255, 0.82);
            color: #3d2b00;
            text-shadow: none;
            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.95);
        }
        .nav-btn.active .nav-icon { transform: scale(1.1); }

        @media (max-width: 340px) {
            #card-gallery { gap: 14px 6px; padding: 2px; }
            #early-list { gap: 12px 8px; padding: 2px; }
            h1 { padding-left: 2px; padding-right: 50px; }
            .card-meta-row { font-size: 0.56em; }
            .nav-btn { padding: 7px 9px; font-size: 0.62em; }
            .early-domain { font-size: 0.84em; }
            .lang-toggle { top: 8px; right: 8px; height: 30px; min-width: 38px; }
        }
    </style>
</head>
<body>
    <button class="lang-toggle" id="lang-toggle" type="button" aria-label="切换语言">EN</button>

    <h1 id="page-title">📜 图鉴·角色</h1>

    <div id="card-gallery"></div>
    <div id="early-list" hidden></div>

    <nav class="bottom-nav" id="bottom-nav" aria-label="内容切换"></nav>

    <!-- 语言切换 + 早鸟名单：都在 /tokendrop/ 目录 -->
    <script src="/tokendrop/lang.js"></script>
    <script src="/tokendrop/earlylist.js"></script>

    <script>
    (function () {
        'use strict';

        const EARLY_ID = 'early';

        const CATEGORIES = [
            { id: 'card',   icon: '🎴', dir: '/assets/card'   },
            { id: 'weapon', icon: '⚔️', dir: '/assets/weapon' },
            { id: 'item',   icon: '🧪', dir: '/assets/item'   }
        ];

        const DATA_URLS = {
            images:     ['data/image.json'],
            characters: ['data/characters.json']
        };

        const container    = document.getElementById('card-gallery');
        const earlyListEl  = document.getElementById('early-list');
        const pageTitle    = document.getElementById('page-title');
        const navEl        = document.getElementById('bottom-nav');
        const langBtn      = document.getElementById('lang-toggle');

        /* 记录每个导航按钮的文字节点，语言变化时刷新 */
        const navTextEls = {};

        const state = {
            activeId: CATEGORIES[0].id,
            cards: null,
            loading: null,
            token: 0
        };

        /* ---------------- 基础工具 ---------------- */

        async function loadFirst(urls) {
            for (const url of (urls || [])) {
                try {
                    const res = await fetch(url);
                    if (!res.ok) continue;
                    return await res.json();
                } catch (_) { /* 换下一个 */ }
            }
            return null;
        }

        function toMap(data) {
            const map = {};
            if (!data) return map;
            if (Array.isArray(data)) {
                data.forEach((item, i) => {
                    if (item == null) return;
                    const key = item.card_id ?? item.id ?? item.name ?? String(i);
                    map[key] = item;
                });
            } else if (typeof data === 'object') {
                Object.keys(data).forEach(k => { map[k] = data[k]; });
            }
            return map;
        }

        function detectCategory(src) {
            const s = String(src || '').toLowerCase();
            if (/(^|\/)(weapon|weapons)\//.test(s)) return 'weapon';
            if (/(^|\/)(item|items)\//.test(s))       return 'item';
            return 'card';
        }

        function normalizeImagePath(src, catId) {
            let s = String(src || '').trim();
            if (!s) return '';
            if (/^(https?:)?\/\//i.test(s) || /^data:/i.test(s)) return s;
            if (s.startsWith('/')) return s;
            if (s.includes('/')) return '/' + s;
            const cat = CATEGORIES.find(c => c.id === catId) || CATEGORIES[0];
            return `${cat.dir}/${s}`;
        }

        function parseSkillDesc(rawSkill) {
            if (!rawSkill) return '';
            if (typeof rawSkill === 'object') {
                return rawSkill.skill_describe || rawSkill.skillName || rawSkill.name || '';
            }
            try {
                const obj = JSON.parse(rawSkill);
                if (obj && typeof obj === 'object') {
                    return obj.skill_describe || obj.skillName || obj.name || '';
                }
                return String(rawSkill);
            } catch {
                return rawSkill;
            }
        }

        function calcFontSize(text) {
            const len = (text || '').length;
            if (len <= 5)  return '0.66em';
            if (len <= 8)  return '0.62em';
            if (len <= 12) return '0.58em';
            if (len <= 18) return '0.54em';
            return '0.5em';
        }

        /* ---------------- 卡牌数据 ---------------- */

        async function loadAllCards() {
            if (state.cards) return state.cards;
            if (state.loading) return state.loading;

            state.loading = (async () => {
                const [imageData, charData] = await Promise.all([
                    loadFirst(DATA_URLS.images),
                    loadFirst(DATA_URLS.characters)
                ]);

                const imgMap  = toMap(imageData);
                const charMap = toMap(charData);

                const ids = Array.from(new Set([
                    ...Object.keys(imgMap),
                    ...Object.keys(charMap)
                ]));

                const cards = ids.map(id => {
                    const rawImg    = imgMap[id];
                    const imgEntry  = (rawImg && typeof rawImg === 'object') ? rawImg : {};
                    const charEntry = (charMap[id] && typeof charMap[id] === 'object') ? charMap[id] : {};

                    const rawSrc = String(
                        imgEntry.image || imgEntry.src || charEntry.image || ''
                    ).trim();

                    const category = detectCategory(rawSrc);
                    const image    = normalizeImagePath(rawSrc, category);
                    const name     = imgEntry.name || charEntry.name || id;

                    const factionLabel = (category === 'card')
                        ? (charEntry.faction || charEntry.camp || '未知')
                        : name;

                    return {
                        id,
                        category,
                        image,
                        name,
                        factionLabel,
                        rarity: charEntry.rarity || 'Common',
                        base_atk: charEntry.base_atk ?? null,
                        base_hp: charEntry.base_hp ?? null,
                        skillDesc: parseSkillDesc(
                            charEntry.skill ?? charEntry.skillDesc ?? charEntry.skill_desc ?? ''
                        )
                    };
                });

                state.cards = cards;
                state.loading = null;
                return cards;
            })();

            return state.loading;
        }

        /* ---------------- 卡牌 DOM ---------------- */

        function createCardElement(card, index) {
            const wrapper = document.createElement('div');
            wrapper.className = 'card-wrapper';
            wrapper.style.animationDelay = Math.min(index * 0.02, 0.4) + 's';

            const imageArea = document.createElement('div');
            imageArea.className = 'card-image-area';

            if (card.image) {
                const img = document.createElement('img');
                img.src = card.image;
                img.alt = card.name;
                img.loading = 'lazy';
                img.addEventListener('error', () => {
                    img.remove();
                    const ph = document.createElement('div');
                    ph.className = 'img-placeholder';
                    ph.textContent = card.name;
                    imageArea.appendChild(ph);
                }, { once: true });
                imageArea.appendChild(img);
            } else {
                const ph = document.createElement('div');
                ph.className = 'img-placeholder';
                ph.textContent = card.name;
                imageArea.appendChild(ph);
            }

            if (card.base_atk !== null && card.base_atk !== undefined) {
                const atk = document.createElement('div');
                atk.className = 'card-atk';
                atk.textContent = card.base_atk;
                imageArea.appendChild(atk);
            }
            if (card.base_hp !== null && card.base_hp !== undefined) {
                const hp = document.createElement('div');
                hp.className = 'card-hp';
                hp.textContent = card.base_hp;
                imageArea.appendChild(hp);
            }

            wrapper.appendChild(imageArea);

            const info = document.createElement('div');
            info.className = 'card-info';

            const metaRow = document.createElement('div');
            metaRow.className = 'card-meta-row';

            const faction = document.createElement('span');
            faction.className = 'card-faction';
            faction.textContent = card.factionLabel;
            faction.title = card.factionLabel;

            const rarity = document.createElement('span');
            rarity.className = 'card-rarity rarity-' + card.rarity;
            rarity.textContent = card.rarity;

            metaRow.appendChild(faction);
            metaRow.appendChild(rarity);
            info.appendChild(metaRow);

            const descText = card.skillDesc || '未知技能';
            const desc = document.createElement('div');
            desc.className = 'card-skill-desc';
            desc.textContent = descText;
            desc.style.fontSize = calcFontSize(descText);
            info.appendChild(desc);

            wrapper.appendChild(info);
            return wrapper;
        }

        /* ---------------- 早鸟名单：调用独立脚本 ---------------- */

        function renderEarlyPage() {
            state.token++;

            container.hidden = true;
            earlyListEl.hidden = false;
            earlyListEl.innerHTML = '';

            if (!window.EarlyList || typeof window.EarlyList.render !== 'function') {
                earlyListEl.innerHTML =
                    '<p class="gallery-status error">早鸟名单脚本未加载<br>' +
                    '<small>请检查 /tokendrop/earlylist.js</small></p>';
                return;
            }

            try {
                window.EarlyList.render(earlyListEl);
            } catch (err) {
                console.error(err);
                earlyListEl.innerHTML = '<p class="gallery-status error">早鸟名单渲染失败</p>';
            }
        }

        /* ---------------- 渲染卡牌分类 ---------------- */

        async function renderCategory(cat) {
            const token = ++state.token;

            container.hidden = false;
            earlyListEl.hidden = true;
            container.innerHTML = '<p class="gallery-status">正在加载…</p>';

            let all;
            try {
                all = await loadAllCards();
            } catch (err) {
                console.error(err);
                if (token !== state.token) return;
                container.innerHTML = '<p class="gallery-status error">图鉴加载失败，请检查数据文件路径</p>';
                return;
            }

            if (token !== state.token) return;

            const cards = all.filter(c => c.category === cat.id);

            if (cards.length === 0) {
                container.innerHTML = `
                    <p class="gallery-status">
                        该分类暂无卡牌<br>
                        <small>请确认 data/image.json 中对应图片路径包含 /${cat.id}/ 目录</small>
                    </p>`;
                return;
            }

            const fragment = document.createDocumentFragment();
            cards.forEach((card, i) => fragment.appendChild(createCardElement(card, i)));

            container.innerHTML = '';
            container.appendChild(fragment);
        }

        /* ---------------- 标题 / 文字刷新 ---------------- */

        function updatePageTitle() {
            pageTitle.textContent = Lang.t('page.' + state.activeId);
        }

        function refreshTexts() {
            // 底部导航按钮文字
            Object.keys(navTextEls).forEach(id => {
                navTextEls[id].textContent = Lang.t('nav.' + id);
            });
            // 顶部标题
            updatePageTitle();
        }

        /* ---------------- 导航 ---------------- */

        function updateNavActive() {
            navEl.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.catId === state.activeId);
            });
        }

        function switchCategory(id) {
            if (state.activeId === id) return;

            state.activeId = id;
            updatePageTitle();
            updateNavActive();

            if (id === EARLY_ID) {
                renderEarlyPage();
                return;
            }

            const cat = CATEGORIES.find(c => c.id === id);
            if (!cat) return;
            renderCategory(cat);
        }

        function buildNav() {
            const frag = document.createDocumentFragment();

            CATEGORIES.forEach(cat => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'nav-btn';
                btn.dataset.catId = cat.id;

                const icon = document.createElement('span');
                icon.className = 'nav-icon';
                icon.textContent = cat.icon;

                const text = document.createElement('span');
                text.textContent = Lang.t('nav.' + cat.id);

                navTextEls[cat.id] = text;

                btn.appendChild(icon);
                btn.appendChild(text);
                btn.addEventListener('click', () => switchCategory(cat.id));
                frag.appendChild(btn);
            });

            const earlyBtn = document.createElement('button');
            earlyBtn.type = 'button';
            earlyBtn.className = 'nav-btn';
            earlyBtn.dataset.catId = EARLY_ID;

            const earlyIcon = document.createElement('span');
            earlyIcon.className = 'nav-icon';
            earlyIcon.textContent = '🐦';

            const earlyText = document.createElement('span');
            earlyText.textContent = Lang.t('nav.early');

            navTextEls[EARLY_ID] = earlyText;

            earlyBtn.appendChild(earlyIcon);
            earlyBtn.appendChild(earlyText);
            earlyBtn.addEventListener('click', () => switchCategory(EARLY_ID));
            frag.appendChild(earlyBtn);

            navEl.appendChild(frag);
        }

        /* ---------------- 启动 ---------------- */

        buildNav();
        updateNavActive();
        updatePageTitle();

        // 右上角语言切换按钮
        if (window.Lang) {
            Lang.mountToggle(langBtn);
            Lang.subscribe(refreshTexts);
        }

        renderCategory(CATEGORIES[0]);
    })();
    </script>
</body>
</html>
