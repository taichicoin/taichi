<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>证道大千</title>
    <style>
        :root {
            --bg: #fdf2cc;
            --text: #3d2b00;
            --gold: #8b5e00;
            --nav-bottom: 4vh;

            --content-max: 760px;
            --content-font: clamp(16px, 1.8vw + 8px, 24px);
            --gap-row: clamp(14px, 1.2vw + 10px, 26px);
            --gap-col: clamp(8px, 0.8vw + 6px, 18px);
        }

        [hidden] { display: none !important; }

        html {
            min-height: 100%;
            background-color: #1a1206;
        }

        body {
            background-color: #1a1206;
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(255, 215, 80, 0.22) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 70%, rgba(255, 180, 50, 0.18) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 50%, rgba(255, 240, 180, 0.20) 0%, transparent 70%),
                linear-gradient(rgba(30, 18, 0, 0.28), rgba(30, 18, 0, 0.28)),
                url('/assets/webp/bg2.webp');
            background-size: auto, auto, auto, auto, cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed, fixed, fixed, fixed, fixed;

            color: var(--text);
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            margin: 0;
            padding: 8px 8px calc(var(--nav-bottom) + 110px) 8px;
            min-height: 100vh;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        h1 {
            max-width: var(--content-max);
            margin: 0 auto 10px auto;
            padding-left: 4px;
            /* 给右上角两个按钮留出空间 */
            padding-right: 108px;
            box-sizing: border-box;
            text-align: left;
            color: #fff6d6;
            font-size: clamp(20px, 2vw + 10px, 30px);
            letter-spacing: 0.04em;
            text-shadow:
                0 1px 3px rgba(0, 0, 0, 0.75),
                0 0 14px rgba(255, 215, 120, 0.35);
        }

        /* ========== 右上角按钮（语言 + 汉堡） ========== */
        .lang-toggle,
        .menu-toggle {
            position: fixed;
            top: 10px;
            z-index: 1000;
            height: 32px;
            padding: 0;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.42);
            background: rgba(255, 255, 255, 0.20);
            backdrop-filter: blur(12px) saturate(160%);
            -webkit-backdrop-filter: blur(12px) saturate(160%);
            color: #fff6d6;
            font-family: inherit;
            cursor: pointer;
            box-shadow:
                0 4px 14px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
            transition: background 0.2s ease, transform 0.12s ease;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        .lang-toggle:hover,
        .menu-toggle:hover { background: rgba(255, 255, 255, 0.32); }
        .lang-toggle:active,
        .menu-toggle:active { transform: scale(0.94); }

        .lang-toggle {
            right: 58px;
            min-width: 42px;
            padding: 0 10px;
            font-size: clamp(11px, 0.4vw + 9px, 14px);
            font-weight: 700;
            letter-spacing: 0.05em;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
        }

        .menu-toggle {
            right: 12px;
            width: 38px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }
        .menu-toggle .menu-bar {
            display: block;
            width: 16px;
            height: 2px;
            background: currentColor;
            border-radius: 1px;
            transition: transform 0.22s ease, opacity 0.18s ease;
        }
        .menu-toggle.open .menu-bar:nth-child(1) {
            transform: translateY(5px) rotate(45deg);
        }
        .menu-toggle.open .menu-bar:nth-child(2) {
            opacity: 0;
        }
        .menu-toggle.open .menu-bar:nth-child(3) {
            transform: translateY(-5px) rotate(-45deg);
        }

        /* ========== 汉堡下拉菜单 ========== */
        .menu-backdrop {
            position: fixed;
            inset: 0;
            z-index: 998;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s;
        }
        .menu-backdrop.visible {
            opacity: 1;
            visibility: visible;
        }

        .hamburger-menu {
            position: fixed;
            top: 50px;
            right: 12px;
            z-index: 1001;
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 150px;
            padding: 6px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.20);
            backdrop-filter: blur(18px) saturate(180%);
            -webkit-backdrop-filter: blur(18px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.42);
            box-shadow:
                0 12px 32px rgba(0, 0, 0, 0.38),
                inset 0 1px 0 rgba(255, 255, 255, 0.55);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px) scale(0.96);
            transform-origin: top right;
            transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
        }
        .hamburger-menu.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 9px 12px;
            border: none;
            background: transparent;
            color: #f3e3b8;
            font-family: inherit;
            font-size: clamp(12px, 0.5vw + 10px, 15px);
            font-weight: 700;
            letter-spacing: 0.02em;
            border-radius: 9px;
            cursor: pointer;
            text-align: left;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
            transition: background 0.18s ease, color 0.18s ease;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            white-space: nowrap;
        }
        .menu-item:hover {
            background: rgba(255, 255, 255, 0.18);
            color: #fff6d6;
        }
        .menu-item.active {
            background: rgba(255, 255, 255, 0.82);
            color: #3d2b00;
            text-shadow: none;
            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.95);
        }
        .menu-item-icon {
            font-size: 1.1em;
            line-height: 1;
            flex-shrink: 0;
        }

        /* ========== 卡牌 / 早鸟 / 空投 / 信息 容器 ========== */
        #card-gallery {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: var(--gap-row) var(--gap-col);
            width: 100%;
            max-width: var(--content-max);
            margin: 0 auto;
            padding: 4px;
            align-items: start;
            box-sizing: border-box;
            font-size: var(--content-font);
        }

        #early-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: var(--gap-row) var(--gap-col);
            width: 100%;
            max-width: var(--content-max);
            margin: 0 auto;
            padding: 4px;
            align-items: stretch;
            box-sizing: border-box;
            font-size: var(--content-font);
        }

        .early-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            min-height: 76px;
            padding: 14px 8px;
            border-radius: 12px;
            box-sizing: border-box;
            text-decoration: none;
            background: linear-gradient(
                135deg,
                var(--early-bg, rgba(255, 255, 255, 0.18)),
                rgba(255, 255, 255, 0.10)
            );
            backdrop-filter: blur(16px) saturate(160%);
            -webkit-backdrop-filter: blur(16px) saturate(160%);
            border: 1px solid var(--early-border, rgba(255, 255, 255, 0.4));
            box-shadow:
                0 8px 22px rgba(0, 0, 0, 0.28),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
            color: #fff6d6;
            font-weight: 700;
            letter-spacing: 0.02em;
            text-shadow:
                0 1px 3px rgba(0, 0, 0, 0.75),
                0 0 10px rgba(0, 0, 0, 0.35);
            transition: transform 0.22s ease, background 0.22s ease,
                        box-shadow 0.22s ease, border-color 0.22s ease;
            animation: cardIn 0.34s ease backwards;
            -webkit-tap-highlight-color: transparent;
        }
        .early-card:hover {
            transform: translateY(-4px);
            background: linear-gradient(
                135deg,
                var(--early-bg, rgba(255, 255, 255, 0.18)),
                rgba(255, 255, 255, 0.18)
            );
            box-shadow:
                0 12px 28px rgba(0, 0, 0, 0.36),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }
        .early-card:active {
            transform: translateY(-1px) scale(0.98);
        }

        .early-index {
            font-size: 0.58em;
            font-weight: 600;
            opacity: 0.72;
            letter-spacing: 0.1em;
        }

        .early-domain {
            font-size: 0.92em;
            line-height: 1.25;
            word-break: break-all;
            text-align: center;
        }

        .card-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            min-width: 0;
            border-radius: 0;
            overflow: visible;
            box-shadow: none;
            background: transparent;
            backdrop-filter: none;
            transition: transform 0.22s ease;
            animation: cardIn 0.34s ease backwards;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(10px) scale(0.96); }
            to   { opacity: 1; transform: none; }
        }
        .card-wrapper:hover { transform: translateY(-4px); }

        .card-image-area {
            position: relative;
            width: 100%;
            aspect-ratio: 100 / 137;
            overflow: hidden;
            flex-shrink: 0;
            border-radius: 0;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-image-area img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .img-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 6px;
            font-size: 0.66em;
            font-weight: 600;
            color: #5c4410;
            background: linear-gradient(135deg, rgba(255,248,220,0.92), rgba(255,225,150,0.8));
            border-radius: 0;
        }

        .card-atk, .card-hp {
            position: absolute;
            top: 78%;
            transform: translateY(-50%);
            font-weight: bold;
            text-shadow: 0 0 5px #000, 0 0 9px rgba(0,0,0,0.85);
            font-size: 0.82em;
            z-index: 3;
            pointer-events: none;
            letter-spacing: 0.3px;
        }
        .card-atk { left: 2%; color: #ff6b6b; }
        .card-hp  { right: 2%; color: #6bff6b; }

        .card-info {
            padding: 5px 2px 0 2px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border: none;
            border-radius: 0;
            min-height: 0;
            box-sizing: border-box;
        }

        .card-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.62em;
            line-height: 1.2;
            padding: 0 1px;
            gap: 3px;
        }
        .card-faction {
            color: #fff6d6;
            font-weight: 700;
            letter-spacing: 0.2px;
            max-width: 68%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-shadow:
                0 1px 3px rgba(0, 0, 0, 0.85),
                0 0 8px rgba(0, 0, 0, 0.55);
        }
        .card-rarity {
            font-weight: bold;
            letter-spacing: 0.2px;
            flex-shrink: 0;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
        }
        .rarity-Common    { color: #d4d4d4; }
        .rarity-Rare      { color: #7db4ff; }
        .rarity-Epic      { color: #c58bff; }
        .rarity-Legendary { color: #ffc24d; }

        .card-skill-desc {
            color: #14140a;
            font-weight: 600;
            text-align: center;
            line-height: 1.35;
            word-break: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 6px;
            padding: 4px 5px;
            border: 1px solid rgba(255, 255, 255, 0.65);
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.3), 0 2px 5px rgba(0,0,0,0.25);
            transition: background 0.2s, border-color 0.2s;
        }
        .card-wrapper:hover .card-skill-desc {
            background: rgba(255, 255, 255, 0.7);
            border-color: rgba(255, 255, 255, 0.8);
        }

        .gallery-status {
            grid-column: 1 / -1;
            text-align: center;
            color: #ffe9b0;
            font-size: 0.85em;
            padding: 40px 0;
            letter-spacing: 0.05em;
            line-height: 1.7;
            text-shadow: 0 1px 3px rgba(0,0,0,0.7);
        }
        .gallery-status.error { color: #ff9d8a; }
        .gallery-status small { font-size: 0.85em; opacity: 0.8; }

        /* ========== 底部导航 ========== */
        .bottom-nav {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: var(--nav-bottom);
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 6px 5px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(18px) saturate(180%);
            -webkit-backdrop-filter: blur(18px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.42);
            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.55);
            z-index: 999;
            white-space: nowrap;
            max-width: calc(100vw - 16px);
        }

        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
            border: none;
            background: transparent;
            color: #f3e3b8;
            font-family: inherit;
            font-size: clamp(10.5px, 0.5vw + 8px, 13px);
            font-weight: 700;
            letter-spacing: 0.02em;
            padding: 7px 9px;
            border-radius: 999px;
            cursor: pointer;
            transition: background 0.22s ease, color 0.22s ease,
                        box-shadow 0.22s ease, transform 0.12s ease;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
        }
        .nav-btn .nav-icon {
            font-size: 1.35em;
            line-height: 1;
            transition: transform 0.22s ease;
        }
        .nav-btn:hover { color: #fff6d6; }
        .nav-btn:active { transform: scale(0.94); }

        .nav-btn.active {
            background: rgba(255, 255, 255, 0.82);
            color: #3d2b00;
            text-shadow: none;
            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.95);
        }
        .nav-btn.active .nav-icon { transform: scale(1.1); }

        @media (max-width: 340px) {
            #card-gallery { gap: 14px 6px; padding: 2px; }
            #early-list { gap: 12px 8px; padding: 2px; }
            h1 { padding-left: 2px; padding-right: 98px; }
            .card-meta-row { font-size: 0.56em; }
            .nav-btn { padding: 7px 7px; font-size: 0.6em; }
            .early-domain { font-size: 0.84em; }
            .lang-toggle { top: 8px; right: 50px; height: 30px; min-width: 38px; }
            .menu-toggle { top: 8px; right: 8px; height: 30px; width: 36px; }
            .hamburger-menu { top: 46px; right: 8px; }
        }
    </style>
</head>
<body>
    <!-- 固定标题，不随页面 / 语言变化 -->
    <h1 id="page-title">📜证道大千</h1>

    <!-- 右上角：语言按钮 + 汉堡按钮 -->
    <button class="lang-toggle" id="lang-toggle" type="button" aria-label="切换语言">EN</button>
    <button class="menu-toggle" id="menu-toggle" type="button" aria-label="菜单" aria-expanded="false">
        <span class="menu-bar"></span>
        <span class="menu-bar"></span>
        <span class="menu-bar"></span>
    </button>

    <div class="menu-backdrop" id="menu-backdrop"></div>
    <nav class="hamburger-menu" id="hamburger-menu" aria-label="菜单">
        <button class="menu-item" type="button" data-page="info">
            <span class="menu-item-icon">📖</span>
            <span class="menu-item-text">项目介绍</span>
        </button>
        <button class="menu-item" type="button" data-page="mech">
            <span class="menu-item-icon">⚙️</span>
            <span class="menu-item-text">代币机制</span>
        </button>
    </nav>

    <div id="card-gallery" hidden></div>
    <div id="early-list" hidden></div>
    <div id="airdrop-list"></div>
    <div id="info-list" hidden></div>
    <div id="mech-list" hidden></div>

    <nav class="bottom-nav" id="bottom-nav" aria-label="内容切换"></nav>

    <!-- 五个脚本都在 /tokendrop/ 目录 -->
    <script src="/tokendrop/lang.js"></script>
    <script src="/tokendrop/earlylist.js"></script>
    <script src="/tokendrop/airdrop.js"></script>
    <script src="/tokendrop/info.js"></script>
    <script src="/tokendrop/mech.js"></script>

    <script>
    (function () {
        'use strict';

        const EARLY_ID   = 'early';
        const AIRDROP_ID = 'airdrop';
        const INFO_ID    = 'info';
        const MECH_ID    = 'mech';

        const CATEGORIES = [
            { id: 'card',   icon: '🎴', dir: '/assets/card'   },
            { id: 'weapon', icon: '⚔️', dir: '/assets/weapon' },
            { id: 'item',   icon: '🧪', dir: '/assets/item'   }
        ];

        const DATA_URLS = {
            images:     ['data/image.json'],
            characters: ['data/characters.json']
        };

        const container     = document.getElementById('card-gallery');
        const earlyListEl   = document.getElementById('early-list');
        const airdropListEl = document.getElementById('airdrop-list');
        const infoListEl    = document.getElementById('info-list');
        const mechListEl    = document.getElementById('mech-list');
        const navEl         = document.getElementById('bottom-nav');
        const langBtn       = document.getElementById('lang-toggle');
        const menuBtn       = document.getElementById('menu-toggle');
        const menuEl        = document.getElementById('hamburger-menu');
        const backdropEl    = document.getElementById('menu-backdrop');

        const navTextEls = {};

        const state = {
            activeId: AIRDROP_ID,
            cards: null,
            loading: null,
            token: 0
        };

        /* ---------------- 基础工具 ---------------- */

        async function loadFirst(urls) {
            for (const url of (urls || [])) {
                try {
                    const res = await fetch(url);
                    if (!res.ok) continue;
                    return await res.json();
                } catch (_) {}
            }
            return null;
        }

        function toMap(data) {
            const map = {};
            if (!data) return map;
            if (Array.isArray(data)) {
                data.forEach((item, i) => {
                    if (item == null) return;
                    const key = item.card_id ?? item.id ?? item.name ?? String(i);
                    map[key] = item;
                });
            } else if (typeof data === 'object') {
                Object.keys(data).forEach(k => { map[k] = data[k]; });
            }
            return map;
        }

        function detectCategory(src) {
            const s = String(src || '').toLowerCase();
            if (/(^|\/)(weapon|weapons)\//.test(s)) return 'weapon';
            if (/(^|\/)(item|items)\//.test(s))       return 'item';
            return 'card';
        }

        function normalizeImagePath(src, catId) {
            let s = String(src || '').trim();
            if (!s) return '';
            if (/^(https?:)?\/\//i.test(s) || /^data:/i.test(s)) return s;
            if (s.startsWith('/')) return s;
            if (s.includes('/')) return '/' + s;
            const cat = CATEGORIES.find(c => c.id === catId) || CATEGORIES[0];
            return `${cat.dir}/${s}`;
        }

        function parseSkillDesc(rawSkill) {
            if (!rawSkill) return '';
            if (typeof rawSkill === 'object') {
                return rawSkill.skill_describe || rawSkill.skillName || rawSkill.name || '';
            }
            try {
                const obj = JSON.parse(rawSkill);
                if (obj && typeof obj === 'object') {
                    return obj.skill_describe || obj.skillName || obj.name || '';
                }
                return String(rawSkill);
            } catch {
                return rawSkill;
            }
        }

        function calcFontSize(text) {
            const len = (text || '').length;
            if (len <= 5)  return '0.66em';
            if (len <= 8)  return '0.62em';
            if (len <= 12) return '0.58em';
            if (len <= 18) return '0.54em';
            return '0.5em';
        }

        /* ---------------- 卡牌数据 ---------------- */

        async function loadAllCards() {
            if (state.cards) return state.cards;
            if (state.loading) return state.loading;

            state.loading = (async () => {
                const [imageData, charData] = await Promise.all([
                    loadFirst(DATA_URLS.images),
                    loadFirst(DATA_URLS.characters)
                ]);

                const imgMap  = toMap(imageData);
                const charMap = toMap(charData);

                const ids = Array.from(new Set([
                    ...Object.keys(imgMap),
                    ...Object.keys(charMap)
                ]));

                const cards = ids.map(id => {
                    const rawImg    = imgMap[id];
                    const imgEntry  = (rawImg && typeof rawImg === 'object') ? rawImg : {};
                    const charEntry = (charMap[id] && typeof charMap[id] === 'object') ? charMap[id] : {};

                    const rawSrc = String(
                        imgEntry.image || imgEntry.src || charEntry.image || ''
                    ).trim();

                    const category = detectCategory(rawSrc);
                    const image    = normalizeImagePath(rawSrc, category);
                    const name     = imgEntry.name || charEntry.name || id;

                    const factionLabel = (category === 'card')
                        ? (charEntry.faction || charEntry.camp || '未知')
                        : name;

                    return {
                        id,
                        category,
                        image,
                        name,
                        factionLabel,
                        rarity: charEntry.rarity || 'Common',
                        base_atk: charEntry.base_atk ?? null,
                        base_hp: charEntry.base_hp ?? null,
                        skillDesc: parseSkillDesc(
                            charEntry.skill ?? charEntry.skillDesc ?? charEntry.skill_desc ?? ''
                        )
                    };
                });

                state.cards = cards;
                state.loading = null;
                return cards;
            })();

            return state.loading;
        }

        /* ---------------- 卡牌 DOM ---------------- */

        function createCardElement(card, index) {
            const wrapper = document.createElement('div');
            wrapper.className = 'card-wrapper';
            wrapper.style.animationDelay = Math.min(index * 0.02, 0.4) + 's';

            const imageArea = document.createElement('div');
            imageArea.className = 'card-image-area';

            if (card.image) {
                const img = document.createElement('img');
                img.src = card.image;
                img.alt = card.name;
                img.loading = 'lazy';
                img.addEventListener('error', () => {
                    img.remove();
                    const ph = document.createElement('div');
                    ph.className = 'img-placeholder';
                    ph.textContent = card.name;
                    imageArea.appendChild(ph);
                }, { once: true });
                imageArea.appendChild(img);
            } else {
                const ph = document.createElement('div');
                ph.className = 'img-placeholder';
                ph.textContent = card.name;
                imageArea.appendChild(ph);
            }

            if (card.base_atk !== null && card.base_atk !== undefined) {
                const atk = document.createElement('div');
                atk.className = 'card-atk';
                atk.textContent = card.base_atk;
                imageArea.appendChild(atk);
            }
            if (card.base_hp !== null && card.base_hp !== undefined) {
                const hp = document.createElement('div');
                hp.className = 'card-hp';
                hp.textContent = card.base_hp;
                imageArea.appendChild(hp);
            }

            wrapper.appendChild(imageArea);

            const info = document.createElement('div');
            info.className = 'card-info';

            const metaRow = document.createElement('div');
            metaRow.className = 'card-meta-row';

            const faction = document.createElement('span');
            faction.className = 'card-faction';
            faction.textContent = card.factionLabel;
            faction.title = card.factionLabel;

            const rarity = document.createElement('span');
            rarity.className = 'card-rarity rarity-' + card.rarity;
            rarity.textContent = card.rarity;

            metaRow.appendChild(faction);
            metaRow.appendChild(rarity);
            info.appendChild(metaRow);

            const descText = card.skillDesc || '未知技能';
            const desc = document.createElement('div');
            desc.className = 'card-skill-desc';
            desc.textContent = descText;
            desc.style.fontSize = calcFontSize(descText);
            info.appendChild(desc);

            wrapper.appendChild(info);
            return wrapper;
        }

        /* ---------------- 页面切换 ---------------- */

        function hideAllPages() {
            container.hidden = true;
            earlyListEl.hidden = true;
            airdropListEl.hidden = true;
            infoListEl.hidden = true;
            mechListEl.hidden = true;
        }

        function renderEarlyPage() {
            state.token++;
            hideAllPages();
            earlyListEl.hidden = false;
            earlyListEl.innerHTML = '';

            if (!window.EarlyList || typeof window.EarlyList.render !== 'function') {
                earlyListEl.innerHTML =
                    '<p class="gallery-status error">早鸟名单脚本未加载<br>' +
                    '<small>请检查 /tokendrop/earlylist.js</small></p>';
                return;
            }

            try {
                window.EarlyList.render(earlyListEl);
            } catch (err) {
                console.error(err);
                earlyListEl.innerHTML = '<p class="gallery-status error">早鸟名单渲染失败</p>';
            }
        }

        function renderAirdropPage() {
            state.token++;
            hideAllPages();
            airdropListEl.hidden = false;
            airdropListEl.innerHTML = '';

            if (!window.Airdrop || typeof window.Airdrop.render !== 'function') {
                airdropListEl.innerHTML =
                    '<p class="gallery-status error">空投脚本未加载<br>' +
                    '<small>请检查 /tokendrop/airdrop.js</small></p>';
                return;
            }

            try {
                window.Airdrop.render(airdropListEl);
            } catch (err) {
                console.error(err);
                airdropListEl.innerHTML = '<p class="gallery-status error">空投内容渲染失败</p>';
            }
        }

        function renderInfoPage() {
            state.token++;
            hideAllPages();
            infoListEl.hidden = false;
            infoListEl.innerHTML = '';

            if (!window.Info || typeof window.Info.render !== 'function') {
                infoListEl.innerHTML =
                    '<p class="gallery-status error">项目介绍脚本未加载<br>' +
                    '<small>请检查 /tokendrop/info.js</small></p>';
                return;
            }

            try {
                window.Info.render(infoListEl);
            } catch (err) {
                console.error(err);
                infoListEl.innerHTML = '<p class="gallery-status error">项目介绍渲染失败</p>';
            }
        }

        function renderMechPage() {
            state.token++;
            hideAllPages();
            mechListEl.hidden = false;
            mechListEl.innerHTML = '';

            if (!window.Mech || typeof window.Mech.render !== 'function') {
                mechListEl.innerHTML =
                    '<p class="gallery-status error">代币机制脚本未加载<br>' +
                    '<small>请检查 /tokendrop/mech.js</small></p>';
                return;
            }

            try {
                window.Mech.render(mechListEl);
            } catch (err) {
                console.error(err);
                mechListEl.innerHTML = '<p class="gallery-status error">代币机制渲染失败</p>';
            }
        }

        async function renderCategory(cat) {
            const token = ++state.token;

            hideAllPages();
            container.hidden = false;
            container.innerHTML = '<p class="gallery-status">正在加载…</p>';

            let all;
            try {
                all = await loadAllCards();
            } catch (err) {
                console.error(err);
                if (token !== state.token) return;
                container.innerHTML = '<p class="gallery-status error">图鉴加载失败，请检查数据文件路径</p>';
                return;
            }

            if (token !== state.token) return;

            const cards = all.filter(c => c.category === cat.id);

            if (cards.length === 0) {
                container.innerHTML = `
                    <p class="gallery-status">
                        该分类暂无卡牌<br>
                        <small>请确认 data/image.json 中对应图片路径包含 /${cat.id}/ 目录</small>
                    </p>`;
                return;
            }

            const fragment = document.createDocumentFragment();
            cards.forEach((card, i) => fragment.appendChild(createCardElement(card, i)));

            container.innerHTML = '';
            container.appendChild(fragment);
        }

        /* ---------------- 文字刷新（标题固定，不参与翻译） ---------------- */

        function refreshTexts() {
            Object.keys(navTextEls).forEach(id => {
                navTextEls[id].textContent = Lang.t('nav.' + id);
            });

            menuEl.querySelectorAll('.menu-item').forEach(el => {
                const id = el.dataset.page;
                const textEl = el.querySelector('.menu-item-text');
                if (textEl && id) textEl.textContent = Lang.t('menu.' + id);
            });

            menuBtn.setAttribute('aria-label', Lang.t('menu.label'));
            menuBtn.setAttribute('title', Lang.t('menu.label'));
        }

        /* ---------------- 导航 ---------------- */

        function updateNavActive() {
            navEl.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.catId === state.activeId);
            });
        }

        function updateMenuActive() {
            menuEl.querySelectorAll('.menu-item').forEach(el => {
                el.classList.toggle('active', el.dataset.page === state.activeId);
            });
        }

        function switchCategory(id) {
            if (state.activeId === id) {
                closeMenu();
                return;
            }

            state.activeId = id;
            updateNavActive();
            updateMenuActive();

            if (id === EARLY_ID)   { renderEarlyPage();   return; }
            if (id === AIRDROP_ID) { renderAirdropPage(); return; }
            if (id === INFO_ID)    { renderInfoPage();    return; }
            if (id === MECH_ID)    { renderMechPage();    return; }

            const cat = CATEGORIES.find(c => c.id === id);
            if (!cat) return;
            renderCategory(cat);
        }

        function createNavButton(id, iconChar) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'nav-btn';
            btn.dataset.catId = id;

            const icon = document.createElement('span');
            icon.className = 'nav-icon';
            icon.textContent = iconChar;

            const text = document.createElement('span');
            text.textContent = Lang.t('nav.' + id);

            navTextEls[id] = text;

            btn.appendChild(icon);
            btn.appendChild(text);
            btn.addEventListener('click', () => switchCategory(id));
            return btn;
        }

        function buildNav() {
            const frag = document.createDocumentFragment();

            CATEGORIES.forEach(cat => {
                frag.appendChild(createNavButton(cat.id, cat.icon));
            });
            frag.appendChild(createNavButton(EARLY_ID, '🐦'));
            frag.appendChild(createNavButton(AIRDROP_ID, '🎁'));

            navEl.appendChild(frag);
        }

        /* ---------------- 汉堡菜单 ---------------- */

        let menuOpen = false;

        function openMenu() {
            if (menuOpen) return;
            menuOpen = true;
            menuEl.classList.add('visible');
            backdropEl.classList.add('visible');
            menuBtn.classList.add('open');
            menuBtn.setAttribute('aria-expanded', 'true');
        }

        function closeMenu() {
            if (!menuOpen) return;
            menuOpen = false;
            menuEl.classList.remove('visible');
            backdropEl.classList.remove('visible');
            menuBtn.classList.remove('open');
            menuBtn.setAttribute('aria-expanded', 'false');
        }

        function bindMenu() {
            menuBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                if (menuOpen) closeMenu();
                else openMenu();
            });

            backdropEl.addEventListener('click', closeMenu);

            menuEl.querySelectorAll('.menu-item').forEach(el => {
                el.addEventListener('click', function () {
                    const page = el.dataset.page;
                    closeMenu();
                    if (page) switchCategory(page);
                });
            });

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && menuOpen) closeMenu();
            });

            window.addEventListener('resize', function () {
                if (menuOpen && window.innerWidth > 900) closeMenu();
            });
        }

        /* ---------------- 启动 ---------------- */

        buildNav();
        updateNavActive();
        updateMenuActive();

        if (window.Lang) {
            Lang.mountToggle(langBtn);
            Lang.subscribe(refreshTexts);
        }

        bindMenu();
        renderAirdropPage();
    })();
    </script>
</body>
</html>
