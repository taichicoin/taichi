<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Multi-Chain Wallet</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        .section { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; border-radius: 8px; }
        input, select, textarea { width: 100%; padding: 8px; margin: 5px 0; box-sizing: border-box; }
        button { padding: 10px 20px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 3px; }
        button:disabled { background: #aaa; }
        #status { color: red; }
        #nodeInfo { font-size: 0.9em; color: #666; word-break: break-all; }
    </style>
</head>
<body>
    <h1>🔐 多链 EVM 钱包（仅导入助记词）</h1>

    <!-- 1. 导入助记词 -->
    <div class="section">
        <h3>1️⃣ 导入助记词</h3>
        <textarea id="mnemonicInput" placeholder="输入你的助记词，用空格分隔" rows="3"></textarea>
        <button onclick="importWallet()">导入钱包</button>
        <p>当前地址: <span id="addressDisplay">未导入</span></p>
    </div>

    <!-- 2. 切换网络与节点 -->
    <div class="section">
        <h3>2️⃣ 网络与节点</h3>
        <select id="chainSelect" onchange="switchChain()">
            <option value="">-- 请选择网络 --</option>
        </select>
        <button onclick="changeNode()" id="changeNodeBtn" disabled>🔄 换节点</button>
        <p>当前网络: <span id="networkName">-</span></p>
        <p>当前节点: <span id="nodeInfo">-</span></p>
        <p>主链币余额: <span id="balanceDisplay">-</span></p>
        <button onclick="refreshBalance()">刷新余额</button>
    </div>

    <!-- 3. 转账 -->
    <div class="section">
        <h3>3️⃣ 发送交易</h3>
        <input type="text" id="toAddress" placeholder="接收地址（0x开头）">
        <input type="text" id="amount" placeholder="发送数量（主链币）">
        <button id="sendBtn" onclick="sendTransaction()" disabled>发送</button>
        <p id="status"></p>
    </div>

    <!-- 使用本地 ethers v5 库 -->
    <script src="/js/ethers.umd.min.js"></script>
    <script>
        // ============ 多链配置（每个链多个节点） ============
        const chains = [
            {
                id: 1, name: "Ethereum Mainnet", symbol: "ETH", explorer: "https://etherscan.io",
                rpcs: [
                    "https://eth.llamarpc.com",
                    "https://rpc.ankr.com/eth",
                    "https://cloudflare-eth.com"
                ]
            },
            {
                id: 56, name: "BNB Smart Chain", symbol: "BNB", explorer: "https://bscscan.com",
                rpcs: [
                    "https://bsc-dataseed.binance.org",
                    "https://bsc-dataseed1.defibit.io",
                    "https://bsc-dataseed2.ninicoin.io"
                ]
            },
            {
                id: 97, name: "BSC Testnet", symbol: "tBNB", explorer: "https://testnet.bscscan.com",
                rpcs: [
                    "https://data-seed-prebsc-1-s1.binance.org:8545",
                    "https://data-seed-prebsc-2-s1.binance.org:8545",
                    "https://bsc-testnet.publicnode.com"
                ]
            },
            {
                id: 137, name: "Polygon", symbol: "MATIC", explorer: "https://polygonscan.com",
                rpcs: [
                    "https://polygon-rpc.com",
                    "https://rpc-mainnet.maticvigil.com",
                    "https://polygon-mainnet.g.alchemy.com/v2/demo"
                ]
            },
            {
                id: 42161, name: "Arbitrum One", symbol: "ETH", explorer: "https://arbiscan.io",
                rpcs: [
                    "https://arb1.arbitrum.io/rpc",
                    "https://arbitrum-mainnet.infura.io/v3/9aa3d95b3bc440fa88ea12eaa4456161"
                ]
            },
            {
                id: 10, name: "Optimism", symbol: "ETH", explorer: "https://optimistic.etherscan.io",
                rpcs: [
                    "https://mainnet.optimism.io",
                    "https://optimism-mainnet.infura.io/v3/9aa3d95b3bc440fa88ea12eaa4456161"
                ]
            },
            {
                id: 43114, name: "Avalanche C-Chain", symbol: "AVAX", explorer: "https://snowtrace.io",
                rpcs: [
                    "https://api.avax.network/ext/bc/C/rpc",
                    "https://avalanche-c-chain.publicnode.com",
                    "https://rpc.ankr.com/avalanche"
                ]
            }
        ];

        // ============ 全局状态 ============
        let wallet = null;
        let provider = null;
        let currentChainId = null;
        let currentRpcIndex = 0;        // 当前链正在使用的节点索引
        let currentChainRpcs = [];      // 当前链的所有节点列表

        // ============ 初始化：填充网络下拉框 ============
        function initChainSelect() {
            const select = document.getElementById('chainSelect');
            select.innerHTML = '<option value="">-- 请选择网络 --</option>';
            chains.forEach(chain => {
                const option = document.createElement('option');
                option.value = chain.id;
                option.text = chain.name;
                select.appendChild(option);
            });
        }

        // ============ 创建 provider（尝试连接指定索引的节点） ============
        async function tryConnectProvider(rpcUrl, chainId, chainName) {
            // 构造 provider 并传入 chainId，避免网络检测
            const prov = new ethers.providers.JsonRpcProvider(
                { url: rpcUrl, timeout: 10000 },
                { chainId: chainId, name: chainName }
            );
            // 简单测试连通性：获取当前区块号
            await prov.getBlockNumber();
            return prov;
        }

        // ============ 连接到链（自动尝试节点列表） ============
        async function connectToChain(chain, startIndex = 0) {
            const rpcs = chain.rpcs;
            for (let i = startIndex; i < rpcs.length; i++) {
                const rpcUrl = rpcs[i];
                try {
                    const prov = await tryConnectProvider(rpcUrl, chain.id, chain.name);
                    // 成功
                    currentRpcIndex = i;
                    currentChainRpcs = rpcs;
                    return prov;
                } catch (e) {
                    console.warn(`节点 ${rpcUrl} 连接失败: ${e.message}`);
                    if (i === rpcs.length - 1) {
                        throw new Error(`所有节点均无法连接 (${chain.name})`);
                    }
                    // 继续尝试下一个
                }
            }
        }

        // ============ 1. 导入助记词 ============
        async function importWallet() {
            const mnemonicText = document.getElementById('mnemonicInput').value.trim();
            if (!mnemonicText) {
                alert('请输入助记词');
                return;
            }
            try {
                wallet = ethers.Wallet.fromMnemonic(mnemonicText);
                document.getElementById('addressDisplay').innerText = wallet.address;
                document.getElementById('sendBtn').disabled = false;
                if (provider) {
                    wallet = wallet.connect(provider);
                    refreshBalance();
                }
            } catch (e) {
                alert('导入失败: ' + e.message);
                console.error(e);
            }
        }

        // ============ 2. 切换网络 ============
        async function switchChain() {
            const chainId = parseInt(document.getElementById('chainSelect').value);
            if (!chainId) return;
            const chain = chains.find(c => c.id === chainId);
            if (!chain) return;

            try {
                provider = await connectToChain(chain, 0); // 从第一个节点开始
                document.getElementById('networkName').innerText = chain.name;
                document.getElementById('nodeInfo').innerText = chain.rpcs[currentRpcIndex];
                document.getElementById('changeNodeBtn').disabled = false;
                currentChainId = chain.id;
                if (wallet) {
                    wallet = wallet.connect(provider);
                    refreshBalance();
                }
            } catch (e) {
                alert('连接失败: ' + e.message);
                document.getElementById('networkName').innerText = '连接失败';
                document.getElementById('nodeInfo').innerText = '-';
                document.getElementById('changeNodeBtn').disabled = true;
            }
        }

        // ============ 换节点（手动切换到下一个） ============
        async function changeNode() {
            if (!currentChainId || currentChainRpcs.length === 0) return;
            const chain = chains.find(c => c.id === currentChainId);
            if (!chain) return;

            // 从下一个节点索引开始尝试
            const nextIndex = (currentRpcIndex + 1) % currentChainRpcs.length;
            try {
                const prov = await tryConnectProvider(currentChainRpcs[nextIndex], chain.id, chain.name);
                provider = prov;
                currentRpcIndex = nextIndex;
                document.getElementById('nodeInfo').innerText = currentChainRpcs[currentRpcIndex];
                if (wallet) {
                    wallet = wallet.connect(provider);
                    refreshBalance();
                }
            } catch (e) {
                alert('切换节点失败: ' + e.message);
                // 尝试再下一个（可递归，但这里简单提示）
            }
        }

        // ============ 刷新余额 ============
        async function refreshBalance() {
            if (!wallet || !provider) {
                alert('请先导入钱包并选择网络');
                return;
            }
            try {
                const balance = await provider.getBalance(wallet.address);
                const symbol = chains.find(c => c.id === currentChainId)?.symbol || 'ETH';
                document.getElementById('balanceDisplay').innerText =
                    ethers.utils.formatEther(balance) + ' ' + symbol;
            } catch (e) {
                document.getElementById('balanceDisplay').innerText = '查询失败: ' + e.message;
            }
        }

        // ============ 3. 发送交易 ============
        async function sendTransaction() {
            const statusEl = document.getElementById('status');
            statusEl.innerText = '';
            if (!wallet || !provider) {
                statusEl.innerText = '请先导入钱包并选择网络';
                return;
            }
            const toAddress = document.getElementById('toAddress').value.trim();
            const amount = document.getElementById('amount').value.trim();
            if (!ethers.utils.isAddress(toAddress)) {
                statusEl.innerText = '无效的接收地址';
                return;
            }
            if (!amount || isNaN(amount) || Number(amount) <= 0) {
                statusEl.innerText = '请输入有效的金额';
                return;
            }
            try {
                statusEl.innerText = '正在发送交易...';
                const tx = await wallet.sendTransaction({
                    to: toAddress,
                    value: ethers.utils.parseEther(amount)
                });
                statusEl.innerText = '交易已广播，哈希: ' + tx.hash;
                console.log('交易详情:', tx);
            } catch (e) {
                statusEl.innerText = '发送失败: ' + e.message;
                console.error(e);
            }
        }

        // ============ 页面加载完成 ============
        window.onload = () => {
            initChainSelect();
        };
    </script>
</body>
</html>
